[package]
name = "freewrite"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "A simple, open-source app to freewrite"
license = "MIT"
repository = "https://github.com/farzaa/freewrite"
publish = false

[dependencies]
eframe = "0.37"
egui = "0.37"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
fontdb = "0.24"
genpdf = "0.2"
ttf-parser = "0.25"
keyring = "4"
open = "5"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
